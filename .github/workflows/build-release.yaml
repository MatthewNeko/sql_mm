name: Build and release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and release (without the leading v)'
        required: true

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yaml
    with:
      version: ${{ github.event.inputs.version }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Archive builds
        run: |
          set -euo pipefail
          mkdir -p releases
          tar -czvf "$GITHUB_WORKSPACE/releases/sql_mm-linux-v${{ inputs.version }}.tar.gz" -C artifacts/sql_mm-linux .
          (cd artifacts/sql_mm-windows && zip -r "$GITHUB_WORKSPACE/releases/sql_mm-windows-v${{ inputs.version }}.zip" .)

      # The relay runs on a different machine from the plugin, so it gets its
      # own archive containing both OS builds plus the documented config.
      # Both artifacts carry the same README/config example; the second copy
      # overwrites the first, which is what we want.
      - name: Archive relay
        run: |
          set -euo pipefail
          mkdir -p relay-pkg
          cp -v artifacts/sqlmm-relay-linux-amd64/* relay-pkg/
          cp -v artifacts/sqlmm-relay-windows-amd64/* relay-pkg/
          tar -czvf "$GITHUB_WORKSPACE/releases/sqlmm-relay-v${{ inputs.version }}.tar.gz" -C relay-pkg .

      - name: Create tag
        run: |
          git config --global user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git config --global user.name "${{ github.repository_owner }}"
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          files: |
            releases/sql_mm-linux-v${{ inputs.version }}.tar.gz
            releases/sql_mm-windows-v${{ inputs.version }}.zip
            releases/sqlmm-relay-v${{ inputs.version }}.tar.gz
          generate_release_notes: true
