// SQLMM relay client configuration.
//
// Read once when the plugin loads, from addons/sql_mm/sql_mm.cfg.
// Every key is optional EXCEPT relay_psk, which the plugin refuses to start
// without when encryption is on (the default).
//
// Environment overrides (handy in containers):
//   SQLMM_RELAY_HOST, SQLMM_RELAY_PORT, SQLMM_RELAY_PSK,
//   SQLMM_RELAY_ENCRYPTION, SQLMM_RELAY_CONFIG

// Where sqlmm-relay listens. If the game server and the relay are on the same
// machine, keep this on loopback.
relay_host = 127.0.0.1
relay_port = 9330

// Channel protection:
//   psk  (default) ChaCha20 + HMAC-SHA256, key derived with HKDF-SHA256.
//   none legacy clear text. Only for a relay on the same box; the plugin warns
//        loudly and the relay must also be set to encryption = none.
relay_encryption = psk

// Pre-shared key. Must be identical to "psk" in the relay's config.json.
// Generate one with:  sqlmm-relay -genkey
// That prints 64 hex characters, which is exactly 32 bytes of key material.
// Anything shorter than 32 bytes is rejected at load time.
//
// Never reuse a key you have used elsewhere, and never commit a real key.
relay_psk =

// TCP connect timeout, seconds.
relay_connect_timeout = 5

// Socket read/write timeout, seconds.
// 0 = use each connection's MySQLConnectionInfo.timeout.
relay_io_timeout = 0

// Largest relay response the plugin will buffer, in MB. Keep it equal to the
// relay's max_payload_bytes (default 16 MB); if the plugin allows more than the
// relay does, the relay rejects the response instead of the plugin truncating.
relay_max_response_mb = 16
